<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Context Insights</title>
<script src="/preload.js"></script>
<style>
  :root {
    --fg: var(--foreground, #333);
    --bg: var(--background, #fafafa);
    --card: color-mix(in srgb, var(--fg) 5%, transparent);
    --line: color-mix(in srgb, var(--fg) 13%, transparent);
    --mute: color-mix(in srgb, var(--fg) 58%, transparent);
    --accent: #5b8def; --bad: #e5714f; --good: #4f9d69;
    --c-base:#6b7280; --c-user:#4f9d69; --c-system:#8c8c8c; --c-reasoning:#a678de; --c-answer:#3fb6c9; --c-toolCalls:#e0a43a; --c-toolAll:#e0a43a;
    --c-commands:#e5714f; --c-files:#5b8def; --c-edits:#d65d9a; --c-search:#6aa84f; --c-mcp:#b08968; --c-other:#9aa5b1; --c-skills:#2dbfa4;
  }
  * { box-sizing: border-box; }
  body { font: 12.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
  header { position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 14px; background: var(--bg); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0 6px 0 0; }
  .tabs, .seg { display: inline-flex; gap: 2px; background: var(--card); padding: 2px; border-radius: 8px; flex-wrap: wrap; }
  .seg { padding: 1px; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  select, input, textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 8px; }
  textarea { width: 100%; min-height: 92px; resize: vertical; font-family: ui-monospace, monospace; font-size: 12px; }
  input[type=number] { width: 105px; }
  button:hover:not(:disabled) { background: var(--card); }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--bg); border-color: var(--line); font-weight: 600; }
  button.ghost { border-color: var(--line); }
  button.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grow { flex: 1; }
  main { padding: 14px; display: grid; gap: 12px; max-width: 1120px; margin: 0 auto; }
  main > *, .cols > *, .kpis > * { min-width: 0; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
  .card h2 { margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); font-weight: 600;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .kpi .v { font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
  .kpi .l, .kpi .s, .mute { color: var(--mute); }
  .kpi .s { font-size: 11px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(290px, 100%), 1fr)); gap: 12px; }
  .stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); position: relative; }
  .stack > i { display: block; height: 100%; }
  .stack > i.free { background: repeating-linear-gradient(45deg, transparent 0 4px, var(--line) 4px 5px); }
  .stack > i.past { background: repeating-linear-gradient(45deg, var(--line) 0 4px, transparent 4px 5px); }
  .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--bad); }
  .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 3px 14px; margin-top: 9px; }
  .legend div { display: flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 0; }
  .legend em { font-style: normal; overflow: hidden; text-overflow: ellipsis; }
  .legend b { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
  .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; }
  .row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; position: relative; padding: 2px 0; cursor: default; }
  .row.click { cursor: pointer; }
  .row.click:hover { background: var(--card); }
  .row.sel { outline: 1px solid var(--accent); border-radius: 4px; }
  .row .bar { position: absolute; inset: 1px auto 1px 0; background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 4px; }
  .row span { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 6px; display: flex; align-items: center; gap: 5px; }
  .row b { position: relative; font-weight: 500; font-variant-numeric: tabular-nums; padding-right: 6px; white-space: nowrap; }
  .row small { color: var(--mute); font-weight: 400; margin-right: 5px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--mute); font-weight: 600; font-size: 11px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--card); }
  .conv { cursor: pointer; display: grid; gap: 6px; } .conv:hover { border-color: var(--accent); }
  .conv .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .meta { color: var(--mute); font-size: 11px; display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; }
  .chip { display: inline-flex; gap: 4px; align-items: center; padding: 0 7px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 11px; white-space: nowrap; }
  a.chip, .chip.link { cursor: pointer; text-decoration: none; color: inherit; } .chip.link:hover { border-color: var(--accent); }
  .chip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .chip.k-compact, .chip.fail, .chip.k-error { color: var(--bad); border-color: var(--bad); }
  .chip.ok, .chip.k-skill, .chip.k-in, .chip.k-mode { color: var(--good); }
  .chip.bg, .chip.k-inject, .chip.k-delegate, .chip.k-model { color: var(--accent); }
  .chip.k-user, .chip.k-out { color: var(--c-toolCalls); }
  .glyph { font: 600 9.5px/1 ui-monospace, monospace; padding: 2px 4px; border-radius: 4px; background: var(--card); border: 1px solid var(--line); color: var(--mute); flex: none; }
  .warn { color: var(--bad); } .pos { color: var(--bad); } .neg { color: var(--good); }
  .diff { font-size: 10.5px; font-weight: 500; }
  svg text { fill: var(--mute); font-size: 10px; }
  .empty { color: var(--mute); text-align: center; padding: 22px; }
  .sub { color: var(--mute); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .tip { position: fixed; pointer-events: none; z-index: 20; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 8px; font-size: 11px; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: none; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .pin { border-color: var(--accent); }
  .pin dl { display: grid; grid-template-columns: 70px 1fr; gap: 3px 10px; margin: 6px 0 0; }
  .pin dt { color: var(--mute); } .pin dd { margin: 0; overflow-wrap: anywhere; }
  .pin dd.click { cursor: pointer; border-radius: 4px; } .pin dd.click:hover { background: var(--card); }
  pre { margin: 4px 0; padding: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; max-height: 320px; overflow: auto;
    white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.4 ui-monospace, monospace; }
  mark { background: #ffd166; color: #111; border-radius: 2px; padding: 0 1px; }
  mark.cur { background: #e5714f; color: #fff; }
  .md { margin: 4px 0; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; max-height: 320px; overflow: auto; overflow-wrap: anywhere; }
  .md h1, .md h2, .md h3, .md h4 { margin: 8px 0 4px; font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--fg); display: block; }
  .md p { margin: 4px 0; } .md ul { margin: 4px 0; padding-left: 18px; } .md code { font: 11px ui-monospace, monospace; background: var(--card); padding: 0 3px; border-radius: 3px; }
  .md pre { max-height: 200px; }
  .jtree { margin: 4px 0; padding: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; max-height: 320px; overflow: auto; font: 11px/1.45 ui-monospace, monospace; }
  .jtree details { border: 0; padding: 0 0 0 12px; } .jtree summary { gap: 4px; }
  .jk { color: var(--accent); } .js { color: var(--good); } .jn { color: var(--c-toolCalls); }
  details { border-bottom: 1px solid var(--line); padding: 3px 0; }
  summary { cursor: pointer; display: flex; gap: 6px; align-items: center; }
  summary b { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
  .item { display: grid; grid-template-columns: 44px minmax(0,1fr) 54px; gap: 6px; padding: 2px 0 2px 14px; cursor: pointer; align-items: center; }
  .item:hover, .item.hl { background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 4px; }
  .item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { margin: 2px 0 6px 14px; }
  .mono { font-family: ui-monospace, monospace; font-size: 11.5px; }
  .field { display: grid; grid-template-columns: 180px minmax(0,1fr); gap: 6px 12px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .field small { color: var(--mute); display: block; }
  .node { position: relative; }
  .node::before { content: ""; position: absolute; left: -10px; top: 50%; width: 10px; border-top: 1px solid var(--line); }
  .node.root::before { display: none; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  .toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 6px 14px; border-radius: 999px; z-index: 30; display: none; }
  .bar2 { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin: 6px 0; }
  .bar2 i { display: block; }
  .lane { display: grid; grid-template-columns: 110px minmax(0,1fr); gap: 8px; align-items: center; padding: 3px 0; }
  .lane .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; } .lane .nm.sel { font-weight: 700; color: var(--accent); }
  .attach { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0; }
  .acard { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-width: 260px; cursor: pointer; }
  .acard img { width: 42px; height: 42px; object-fit: cover; border-radius: 4px; flex: none; background: var(--card); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal img { max-width: 100%; max-height: 90vh; border-radius: 8px; background: #fff; }
  .pickpop { position: relative; }
  .pickmenu { position: absolute; right: 0; top: 100%; margin-top: 4px; width: 280px; max-height: 280px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px; z-index: 15; box-shadow: 0 6px 20px rgba(0,0,0,.22); }
  .pickopt { padding: 4px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pickopt:hover, .pickopt.on { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 4px; }
  .tbox { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; align-items: stretch; }
</style>
</head>

async function render(soft) {

    }
    let html = '', after = null;
    if (S.tab === 'insights') {
      S.o = await api('/api/overview', { days: S.rangeDays, day: S.f.day || '', from: S.from, to: S.to, archived: S.archived });
      html = viewInsights(S.o);
    } else if (S.tab === 'settings') {
      html = viewSettings();
    } else if (S.tab === 'fleet') {
      S.fl = await api('/api/fleet', { id: curId() });
      html = S.fl.error ? `<div class="empty">${t('none')}</div>` : viewFleet(S.fl);
    } else {

      html = ctxNav(d) + body;

        }
        if (S.view === 'browser' && S.autoExpandStep && S.browse) {
          const match = S.browse.items.find((i) => i.step === S.autoExpandStep && (!S.openCat || i.cat === S.openCat)) || S.browse.items.find((i) => i.step === S.autoExpandStep);
          S.autoExpandStep = null;

  }, S.tab === 'insights' ? 60000 : 20000);
}

  else S.flQ = e.target.value;
  const pos = e.target.selectionStart;
  clearTimeout(input.t); input.t = setTimeout(async () => { await render(true); const el = $('#' + id); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }, 160);
});
function input() {}
document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (id === 'dfrom') { S.from = e.target.value; S.f.day = null; S.page = 0; render(true); }
  else if (id === 'dto') { S.to = e.target.value; S.f.day = null; S.page = 0; render(true); }
  else if (id === 'archsel') { S.archived = e.target.value; S.page = 0; api('/api/settings/save', { archivedMode: S.archived }).catch(() => {}); render(true); }
});
document.addEventListener('toggle', (e) => { if (e.target.tagName === 'DETAILS' && e.target.dataset.cat) S.openCat = e.target.open ? e.target.dataset.cat : (S.openCat === e.target.dataset.cat ? null : S.openCat); }, true);
$('#refresh').addEventListener('click', () => render(true));
render();
</script>
